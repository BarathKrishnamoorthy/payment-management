version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: rb_mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: rb_admin
      MONGO_INITDB_ROOT_PASSWORD: rb_secure_password_2026
      MONGO_INITDB_DATABASE: rb_payment_db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - rb_network

  backend:
    build:
      context: ../backend
      dockerfile: ../deployment/Dockerfile.backend
    container_name: rb_backend
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGODB_URI: mongodb://rb_admin:rb_secure_password_2026@mongodb:27017/rb_payment_db?authSource=admin
      JWT_SECRET: rb_payment_management_jwt_secret_super_secure_key_2026
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
    volumes:
      - uploads_data:/app/uploads
    networks:
      - rb_network

  frontend:
    build:
      context: ../frontend
      dockerfile: ../deployment/Dockerfile.frontend
    container_name: rb_frontend
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    networks:
      - rb_network

volumes:
  mongo_data:
  uploads_data:

networks:
  rb_network:
    driver: bridge

